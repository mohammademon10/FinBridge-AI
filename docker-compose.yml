services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finbridge-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - LLM_PROVIDER=mock
    volumes:
      - backend-db:/app/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: finbridge-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend-db:
